<!doctype html><html lang="en"><meta charset="utf-8"><title>Wand desktop acceptance</title><style>body{font:24px system-ui;margin:48px;max-width:850px}button,input{font:inherit;padding:16px;margin:12px 0}section{height:100vh}#click{height:45vh;width:100%}#result{padding:20px;background:#e8f5ef}</style><h1>Wand browser test</h1><p>Disposable local test. Nothing is sent or saved.</p><label for="entry">Test text</label><br><input id="entry" placeholder="Type through Wand"><br><button id="click" onclick="document.getElementById('result').textContent='Coordinate click passed'">Test coordinate click</button><p id="result" role="status">Waiting for Wand</p><section><p>Scroll down to find the end marker.</p></section><h2 id="end">Scroll test reached the end</h2><script>document.getElementById('entry').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('result').textContent='Keyboard Enter passed: '+e.target.value})</script></html>
