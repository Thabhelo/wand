name: Muse verification deployment
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wand-production-release
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Check deployment credential is configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Configure the existing Cloudflare deployment secret before running this manual workflow.'; exit 1; }
      - run: npm ci --no-audit --no-fund
      - run: npm run build:contracts
      - run: npm test
      - run: npm audit
      - name: Publish authorized relay verification endpoint
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '4084f54ebeae91ba5d0692ad6df75d54'
          WRANGLER_SEND_METRICS: 'false'
        run: npm run deploy
      - name: Add verified Muse callbacks to the existing client
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '4084f54ebeae91ba5d0692ad6df75d54'
          WRANGLER_SEND_METRICS: 'false'
        run: node scripts/update-muse-callbacks.mjs --apply
      - name: Check public proof and relay health
        run: |
          curl --fail --silent --show-error https://api.getwand.app/healthz
          test "$(curl --fail --silent --show-error https://api.getwand.app/.well-known/muse-challenge/418da93af2297ca7bf7b8dff7f618e63a20fb5d9e380b5be48c233b6bad5e926)" = 'muse-challenge=418da93af2297ca7bf7b8dff7f618e63a20fb5d9e380b5be48c233b6bad5e926'
