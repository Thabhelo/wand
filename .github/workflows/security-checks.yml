name: Relay and website checks
on:
  push:
    paths: ['cloud/**', 'site/**', 'web/**', 'contracts/**', '.github/workflows/security-checks.yml']
  pull_request:
    paths: ['cloud/**', 'site/**', 'web/**', 'contracts/**', '.github/workflows/security-checks.yml']
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --prefix cloud --no-audit --no-fund
      - run: npm run build:contracts --prefix cloud
      - run: npm test --prefix cloud
      - run: npm audit --prefix cloud
      - run: npm ci --prefix site --no-audit --no-fund
      - run: npm run check --prefix site
      - run: npm audit --prefix site
