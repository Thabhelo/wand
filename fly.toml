# Set app to your available Fly application name before deploying.
app = "macbridge-replace-me"
primary_region = "ord"
[build]
  dockerfile = "Dockerfile"
[env]
  DATABASE_PATH = "/data/macbridge.sqlite3"
[[mounts]]
  source = "macbridge_data"
  destination = "/data"
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "3s"
    path = "/healthz"
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
